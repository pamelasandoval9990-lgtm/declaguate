    <style>
        .form-container {
            width: 100%;
            text-align: center; /* Centra el cuadro en la pantalla */
            margin-top: 40px;
        }
        .form-box {
            display: inline-block;
            text-align: left;
            border: 1px solid #b5b5b5;
            width: 550px;
            font-family: verdana, sans-serif;
            font-size: 11px;
            color: #000;
        }
        .form-header {
            background-color: #f0f0f0;
            border-bottom: 1px solid #b5b5b5;
            padding: 10px;
            font-weight: bold;
        }
        .form-table {
            width: 100%;
            border-collapse: collapse;
        }
        .form-table td {
            padding: 15px 10px;
            vertical-align: top;
        }
        .form-label {
            font-weight: bold;
            width: 40%;
        }
        .form-input-container {
            width: 60%;
        }
        .form-input {
            border: 1px solid #000;
            padding: 2px;
            width: 160px;
        }
        .form-ejemplo {
            font-size: 9px;
            margin-left: 5px;
        }
        .form-error {
            color: red;
            font-weight: bold;
            font-size: 10px;
            display: block;
            margin-top: 5px;
        }
        .btn-buscar {
            background-color: #2b4c8c;
            color: white;
            font-weight: bold;
            font-family: verdana;
            font-size: 12px;
            border: 1px solid #1a305e;
            padding: 6px 20px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .btn-buscar:hover {
            background-color: #1a305e;
        }
